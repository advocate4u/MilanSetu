name: MilanSetu Integration Smoke

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build and start local stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:7001/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color api
          exit 1

      - name: Verify database health
        run: |
          curl --fail --silent http://127.0.0.1:7001/api/health/database
          echo

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Collect API logs
        if: failure()
        run: docker compose logs --no-color api postgres

      - name: Tear down
        if: always()
        run: docker compose down -v
