name: MilanSetu Integration Smoke

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PostgreSQL
            compose: docker-compose.yml
            api_port: 7001
            services: "api postgres"
          - name: MySQL
            compose: docker-compose.mysql.yml
            api_port: 7002
            services: "api mysql"
    name: Compose smoke (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4

      - name: Build and start ${{ matrix.name }} stack
        run: docker compose -f ${{ matrix.compose }} up -d --build

      - name: Wait for API health
        run: |
          for i in {1..45}; do
            if curl --fail --silent http://127.0.0.1:${{ matrix.api_port }}/api/health > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 2
          done
          docker compose -f ${{ matrix.compose }} ps
          docker compose -f ${{ matrix.compose }} logs --no-color ${{ matrix.services }}
          exit 1

      - name: Verify database health
        run: |
          response="$(curl --fail --silent http://127.0.0.1:${{ matrix.api_port }}/api/health/database)"
          echo "$response"
          echo "$response" | grep -F '"status":"ok"'

      - name: Show service status
        if: always()
        run: docker compose -f ${{ matrix.compose }} ps

      - name: Collect API logs
        if: failure()
        run: docker compose -f ${{ matrix.compose }} logs --no-color ${{ matrix.services }}

      - name: Tear down
        if: always()
        run: docker compose -f ${{ matrix.compose }} down -v
