services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: milansetu
      POSTGRES_USER: milansetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "5432:5432"
    volumes:
      - milansetu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milansetu -d milansetu"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ./backend/MilanSetu.Api
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=milansetu;Username=milansetu;Password=${POSTGRES_PASSWORD:-change-me-local-only}
      Auth__Jwt__Key: ${JWT_KEY:-local-development-key-change-this-to-at-least-32-bytes}
      Auth__Jwt__Issuer: MilanSetu
      Auth__Jwt__Audience: MilanSetu.Web
      Verification__HashKey: ${VERIFICATION_HASH_KEY:-local-development-verification-key-change-this}
      Cors__AllowedOrigins__0: http://localhost:5173
    ports:
      - "7001:8080"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  milansetu-postgres:
